name: PHP security regression
on: [push, pull_request]
jobs:
  differential-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local secrets
        run: docker run --rm --mount "type=bind,source=${PWD},target=/lab" -w /lab php:8.3-cli php scripts/setup.php
      - name: Build and start Apache/PHP/MySQL
        run: docker compose up -d --build --wait
      - name: Build PHPUnit runner
        run: docker compose --profile test build tests
      - name: Run paired HTTP security tests
        run: docker compose run --rm tests
      - name: Application logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-security-regression
          path: artifacts/
      - name: Stop ephemeral lab
        if: always()
        run: docker compose down -v
